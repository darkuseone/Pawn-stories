name: Build video

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Имя файла в jobs/ без .json'
        required: true
        default: 'garage-sale-millions-ming-durer-faberge'
      stage:
        description: 'material / vet / assets / render / post / shorts / auto'
        required: true
        default: 'auto'
  # Автозапуск:
  #   • новый jobs/*.json (git A) → stage auto
  #   • файл .github/rebuild/<job> → принудительный перезапуск этого job
  # Правки существующих jobs (reject/queries) полный auto НЕ жгут.
  push:
    paths:
      - 'jobs/*.json'
      - '.github/rebuild/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # лимит GitHub 360, оставляем запас на выкладку

    steps:
      # fetch-depth 0: на push нужен before..sha, чтобы увидеть diff-filter=A.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Нужен до шага pick: там читаем id из JSON. На skip всё равно дёшево.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Какой ролик собираем
        id: pick
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # Новый бранч / force-push: before — нули, сравниваем с родителем.
            if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -qE '^0+$'; then
              BEFORE="$(git rev-parse 'HEAD^' 2>/dev/null || true)"
            fi
            JOB=""
            STAGE=auto
            # 1) Явный перезапуск: .github/rebuild/<job>
            #    Имя файла = id джоба без .json. README/мусор игнорируем —
            #    берём только то, для чего есть jobs/<name>.json.
            REBUILD=""
            if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                j=$(basename "$f")
                case "$j" in
                  README.md|README|.gitkeep) continue ;;
                esac
                if [ -f "jobs/$j.json" ]; then
                  REBUILD=$j
                  break
                fi
              done < <(git diff --name-only "$BEFORE" "${{ github.sha }}" -- '.github/rebuild/' || true)
            fi
            if [ -n "$REBUILD" ]; then
              JOB="$REBUILD"
              # Содержимое файла — стадия. Пустой или мусор → auto, как
              # раньше. Иначе нельзя запустить shorts/material/render
              # без workflow_dispatch.
              raw=$(tr -d '[:space:]' < ".github/rebuild/$JOB" 2>/dev/null || true)
              case "$raw" in
                material|vet|assets|render|post|shorts|auto) STAGE=$raw ;;
                *) STAGE=auto ;;
              esac
              echo "Принудительный перезапуск: .github/rebuild/$JOB (stage: $STAGE)"
            else
              ADDED=""
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
                ADDED=$(git diff --diff-filter=A --name-only "$BEFORE" "${{ github.sha }}" -- 'jobs/*.json' \
                  | grep -vE '\.example\.json$|^jobs/_' \
                  | grep -vE '^jobs/auction-test\.json$' \
                  || true)
              fi
              if [ -n "$ADDED" ]; then
                # Несколько новых файлов за один push — берём первый.
                JOB=$(basename "$(echo "$ADDED" | head -1)" .json)
                echo "Автозапуск по новому файлу: jobs/$JOB.json"
              fi
            fi
            if [ -z "$JOB" ]; then
              echo "push без нового job и без .github/rebuild — полный auto не запускаю"
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "job=" >> $GITHUB_OUTPUT
              echo "stage=auto" >> $GITHUB_OUTPUT
              echo "id=" >> $GITHUB_OUTPUT
              echo "do_assets=false" >> $GITHUB_OUTPUT
              echo "do_build=false" >> $GITHUB_OUTPUT
              echo "do_pack=false" >> $GITHUB_OUTPUT
              echo "do_shorts=false" >> $GITHUB_OUTPUT
              echo "from_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            JOB="${{ github.event.inputs.job }}"
            STAGE="${{ github.event.inputs.stage }}"
          fi
          test -n "$JOB" || { echo "Пустой job"; exit 1; }
          test -f "jobs/$JOB.json" || { echo "Нет файла jobs/$JOB.json"; exit 1; }
          # Папка работ называется по полю id ВНУТРИ спецификации, а не по
          # имени файла: они могут не совпадать, и тогда кэш и выкладка
          # смотрят в несуществующую папку.
          ID=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "jobs/$JOB.json")
          echo "skip=false"   >> $GITHUB_OUTPUT
          echo "job=$JOB"     >> $GITHUB_OUTPUT
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "id=$ID"       >> $GITHUB_OUTPUT

          # ЧТО ДЕЛАЕМ НА ЭТОЙ СТАДИИ — считается ОДИН раз и здесь.
          # Раньше каждый шаг нёс цепочку вида «!= assets && != material &&
          # != vet && != post», и добавление новой стадии означало вписать
          # её в пять мест, ничего не забыв. Флаг на шаг читается сразу и
          # ошибиться в нём негде.
          #
          #   assets  — озвучка, генерация картинок, скачивание материала
          #   build   — монтаж ffmpeg (самое долгое: 70-90 минут)
          #   pack    — обложки и комплект для YouTube
          #   shorts  — вертикальные шортсы из готового final.mp4
          #   fromrel — final.mp4 берём из релиза, а не собираем
          # НЕИЗВЕСТНАЯ СТАДИЯ РОНЯЕТ ПРОГОН, а не запускает полную сборку.
          # Раньше здесь стояло «*) полный прогон», и это дорого стоило:
          # запуск, у которого stage не доехал (dispatch вернул HTTP 500),
          # попал в эту ветку и час молотил сборку целиком — озвучку,
          # генерацию и монтаж, — вместо двухминутной нарезки шортсов,
          # которую заказывали. Опечатка в имени стадии обходилась бы так же.
          # Полный прогон теперь только по явному auto.
          A=false; B=false; P=false; S=false; R=false
          case "$STAGE" in
            material|vet) ;;
            assets)  A=true ;;
            render)  B=true; P=true; S=true ;;
            post)    P=true; S=true; R=true ;;
            shorts)  S=true; R=true ;;
            auto)    A=true; B=true; P=true; S=true ;;
            *)
              echo "Неизвестная стадия: «$STAGE»"
              echo "Ожидается одна из: material, vet, assets, render, post, shorts, auto"
              echo "Полная сборка запускается ТОЛЬКО по явному auto — молча"
              echo "тратить час раннера на непонятное значение неправильно."
              exit 1 ;;
          esac
          echo "do_assets=$A"  >> $GITHUB_OUTPUT
          echo "do_build=$B"   >> $GITHUB_OUTPUT
          echo "do_pack=$P"    >> $GITHUB_OUTPUT
          echo "do_shorts=$S"  >> $GITHUB_OUTPUT
          echo "from_release=$R" >> $GITHUB_OUTPUT
          echo "Собираю: $JOB (папка work/$ID), этап: $STAGE"
          echo "  материал=$A монтаж=$B упаковка=$P шортсы=$S из-релиза=$R"

      - name: Ставим FFmpeg и библиотеки
        if: steps.pick.outputs.skip != 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet pillow requests numpy
          fc-list | grep -qi dejavu || sudo apt-get install -y -qq fonts-dejavu
          fc-list | grep -qi "liberation sans" || sudo apt-get install -y -qq fonts-liberation
          echo "ffmpeg: $(ffmpeg -version | head -1)"

      - name: Проверка секретов
        if: steps.pick.outputs.skip != 'true'
        env:
          XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          MAGNIFIC_API_KEY:   ${{ secrets.MAGNIFIC_API_KEY }}
          # Только факт наличия, не значения: Variables в логах НЕ маскируются.
          SAME_NAMES_IN_VARS: ${{ vars.XAI_API_KEY != '' || vars.ELEVENLABS_API_KEY != '' || vars.PEXELS_API_KEY != '' || vars.PIXABAY_API_KEY != '' || vars.MAGNIFIC_API_KEY != '' }}
        run: |
          # На material и render генерация и озвучка не запускаются, их ключи
          # там не нужны — иначе бесплатный добор падал бы из-за xAI.
          # material не требует ничего обязательного: четыре источника из
          # семи открыты и работают без ключей (Wikimedia, Met, Library of
          # Congress, archive.org). Без Pexels и Pixabay не будет только
          # стокового видео — этап соберёт архивные фото и листы отбора,
          # а не упадёт. Проверка, которая роняет работающий прогон, хуже
          # отсутствующей. MAGNIFIC_API_KEY нигде не в need: без него
          # генерация картинок целиком уходит на xAI, а сток-заплатка и
          # видео-вставки просто не добираются — штатный режим.
          case "${{ steps.pick.outputs.stage }}" in
            material) need="" ; want="PEXELS_API_KEY PIXABAY_API_KEY MAGNIFIC_API_KEY" ;;
            vet)      need="" ; want="XAI_API_KEY" ;;
            render)   need="" ; want="" ;;
            # post: только обложки, youtube-комплект и шортсы поверх УЖЕ
            # готового final.mp4 из релиза — ни озвучки, ни генерации
            # картинок здесь не запускается, ключ нужен только covers.py.
            post)     need="" ; want="XAI_API_KEY" ;;
            # shorts: только нарезка из готового final.mp4, ключи не нужны
            # вовсе — ни генерации, ни озвучки, ни обложек здесь нет.
            shorts)   need="" ; want="" ;;
            *)        need="XAI_API_KEY ELEVENLABS_API_KEY PEXELS_API_KEY PIXABAY_API_KEY" ; want="ELEVENLABS_VOICE_ID MAGNIFIC_API_KEY" ;;
          esac
          for k in $want; do
            eval "v=\$$k"
            if [ -z "$v" ]; then
              case "$k" in
                ELEVENLABS_VOICE_ID)
                  echo "нет:   $k — будет взято поле voice_id из спецификации ролика" ;;
                MAGNIFIC_API_KEY)
                  echo "нет:   $k — генерация картинок целиком уйдёт на xAI, футаж и графика через magnific не добираются" ;;
                *)
                  echo "нет:   $k — необязателен, продолжаю без него" ;;
              esac
            else
              echo "есть:  $k"
            fi
          done
          miss=0
          for k in $need; do
            eval "v=\$$k"
            if [ -z "$v" ]; then echo "ПУСТО: $k"; miss=1; else echo "есть:  $k"; fi
          done
          if [ $miss -ne 0 ]; then
            echo
            echo "Settings -> Secrets and variables -> Actions -> вкладка Secrets"
            echo "(именно Repository secrets, имена посимвольно)"
            if [ "$SAME_NAMES_IN_VARS" = "true" ]; then
              echo "НАЙДЕНО: ключи с этими именами лежат во вкладке Variables."
              echo "Их надо перенести в Secrets: значения Variables видны в логах."
            fi
            exit 1
          fi

      # Ключ уникален на запуск, восстановление по префиксу берёт самую
      # свежую запись. С постоянным ключом cache не сохраняет ничего.
      - name: Достаём материалы из кэша
        if: steps.pick.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: work/${{ steps.pick.outputs.id }}/assets
          key: assets-${{ steps.pick.outputs.id }}-v1-${{ github.run_id }}
          restore-keys: |
            assets-${{ steps.pick.outputs.id }}-v1-

      # material/vet/render не заказывают озвучку заново. Если кэш не
      # поднялся, папка пустая: material скачает только футаж и запишет
      # его новым ключом — следующий render потеряет оплаченный голос.
      - name: Озвучка из кэша на месте
        if: steps.pick.outputs.skip != 'true' && (steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet' || steps.pick.outputs.do_build == 'true')
        run: |
          set -e
          VOICE="work/${{ steps.pick.outputs.id }}/assets/voice_full.m4a"
          test -f "$VOICE" || {
            echo "нет $VOICE — кэш assets-${{ steps.pick.outputs.id }}-v1- не поднялся"
            echo "без озвучки material/vet/render запускать нельзя: следующий"
            echo "прогон затёр бы оплаченный голос пустым кэшем. Нужен полный"
            echo "stage: auto (или assets), если кэш уже протух."
            exit 1
          }
          echo "озвучка на месте: $(du -h "$VOICE" | cut -f1)"

      # Стадии post и shorts: упаковка переделывается без пересборки монтажа.
      # Монтаж (build.py) не бесплатный по времени (70-90 минут ffmpeg на
      # получасовом ролике) и на КАЖДУЮ мелкую правку запускать его заново
      # незачем — картинка от этого не меняется. final.mp4 берётся готовым
      # из релиза final-<job>, который выложил предыдущий полный прогон.
      #
      # marks_final.json — тайм-коды на шкале ГОТОВОГО ролика (с паузами
      # глав). Он лежит в релизе с этой правки; для релизов, выложенных
      # раньше, shorts.py пересчитает сдвиг сам (см. load_final_marks).
      # Поэтому --pattern на него не обязателен и прогон не роняет.
      #
      # Разница стадий: post переделывает обложки + youtube + шортсы,
      # shorts — ТОЛЬКО шортсы. Отдельная стадия нужна потому, что covers.py
      # рисует обложки заново каждым запуском, и прогон ради одних шортсов
      # молча заменил бы уже принятые человеком обложки другими.
      - name: Готовый final.mp4 из релиза, без пересборки
        if: steps.pick.outputs.from_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DIR=work/${{ steps.pick.outputs.id }}/out
          mkdir -p "$DIR"
          gh release download "final-${{ steps.pick.outputs.job }}" \
            --repo "${{ github.repository }}" \
            --pattern "final.mp4" --pattern "subs.srt" \
            --pattern "marks_final.json" \
            --dir "$DIR" --clobber || true
          test -f "$DIR/final.mp4" || {
            echo "нет final.mp4 в релизе final-${{ steps.pick.outputs.job }} — сначала нужен полный прогон (stage: auto)"
            exit 1
          }
          test -f "$DIR/marks_final.json" \
            && echo "marks_final.json взят из релиза" \
            || echo "marks_final.json в релизе нет — shorts.py пересчитает сдвиг сам"

      - name: Только отбраковка — без скачивания
        if: steps.pick.outputs.stage == 'vet'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -e
          python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json vet
          python pipeline/preview.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Этап 0 — добор материала и листы отбора
        if: steps.pick.outputs.stage == 'material'
        env:
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:  ${{ secrets.PIXABAY_API_KEY }}
          # Отбраковка на этом этапе тоже смотрит зрением, ключ ей нужен.
          XAI_API_KEY:      ${{ secrets.XAI_API_KEY }}
          # Нужен только если в спецификации есть graphic_queries и по ним
          # не нашлось обычными архивами — иначе просто не используется.
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: |
          set -e
          python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json material
          python pipeline/preview.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Выдаём листы отбора
        if: steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet'
        uses: actions/upload-artifact@v4
        with:
          name: select-${{ steps.pick.outputs.job }}
          path: work/${{ steps.pick.outputs.id }}/out/select_*.jpg
          if-no-files-found: error
          retention-days: 30

      # Те же листы ещё и релизом. Артефакт лежит на хранилище Azure, и
      # ссылка на него временная и подписанная: её нельзя просто открыть,
      # переслать или забрать скриптом. Релиз отдаётся с github.com прямой
      # ссылкой, которая не протухает — а шаг отбора это ровно тот шаг,
      # где листы надо открыть, посмотреть и обсудить.
      - name: Листы отбора отдельной ссылкой
        if: steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: select-${{ steps.pick.outputs.job }}
          name: Отбор материала — ${{ steps.pick.outputs.job }}
          body: |
            Контактные листы: крупный номер в углу — номер файла.
            Негодное вписать в `reject` в спецификации ролика:

                "reject": { "clip": [номера], "arch": [номера] }

            Жёлтой рамкой обведены кадры на белом фоне: на тёплом тёмном
            цветокоре канала они становятся бледными прямоугольниками.
            Это пометка, а не приговор — решать человеку.

            Файлы при отказе не удаляются: отказ отменяется удалением
            номера, без повторного скачивания.
          files: work/${{ steps.pick.outputs.id }}/out/select_*.jpg
          fail_on_unmatched_files: true

      - name: Этап 1 — озвучка, изображения, материал
        id: assets
        if: steps.pick.outputs.do_assets == 'true'
        env:
          XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Голос канала. Без этой строки секрет есть в репозитории, но до
          # процесса не доходит, и озвучка падает на «не задан голос».
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          # Необязателен: без него 70/30 не делится, всё уходит на xAI.
          MAGNIFIC_API_KEY:   ${{ secrets.MAGNIFIC_API_KEY }}
        run: python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json

      # Кэш кладём и при падении этапа 1: иначе оплаченная озвучка/картинки
      # блоков 1..N пропадают вместе с раннером, а перезапуск жжёт квоту снова.
      # material/vet тоже пишут в assets (новый футаж, vetted.json) — без
      # save следующий stage: render поднял бы СТАРЫЙ кэш, и титры IA,
      # которые только что отбраковали, снова попали бы в монтаж.
      # На чистом render/post/shorts папка assets не менялась — save не нужен.
      - name: Кладём материалы в кэш
        if: ${{ always() && steps.pick.outputs.skip != 'true' && (steps.pick.outputs.do_assets == 'true' || steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet') }}
        uses: actions/cache/save@v4
        with:
          path: work/${{ steps.pick.outputs.id }}/assets
          key: assets-${{ steps.pick.outputs.id }}-v1-${{ github.run_id }}

      - name: Этап 2 — монтаж
        if: steps.pick.outputs.do_build == 'true'
        run: python pipeline/build.py jobs/${{ steps.pick.outputs.job }}.json

      # ОБЛОЖКИ ДО youtube.py. Порядок не случайный: covers.py делает две
      # обложки и кладёт первую в thumbnail.jpg, а youtube.py, увидев
      # cover_1.jpg, свой кадровый вариант уже не рисует. Поменяй шаги
      # местами — и к человеку уедет превью попроще.
      - name: Этап 3 — две обложки
        if: steps.pick.outputs.do_pack == 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python pipeline/covers.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Этап 4 — комплект для YouTube
        if: steps.pick.outputs.do_pack == 'true'
        run: python pipeline/youtube.py jobs/${{ steps.pick.outputs.job }}.json

      # ШОРТСЫ ПОСЛЕДНИМИ, на уже готовом final.mp4. Ничего не рендерят
      # заново: режут два куска из готового ролика, разворачивают в 9:16 и
      # накладывают шапку с вопросом и субтитры кусками фразы.
      #
      # continue-on-error: длинный ролик к этому моменту собран и лежит в
      # релизе. Уронить весь прогон из-за того, что beats.py не нашёл
      # годной развязки для шортса, значит потерять сорок минут рендера
      # ради необязательного довеска.
      - name: Этап 5 — два шортса
        if: steps.pick.outputs.do_shorts == 'true'
        continue-on-error: true
        run: python pipeline/shorts.py jobs/${{ steps.pick.outputs.job }}.json 2

      - name: Находим готовое
        id: out
        if: steps.pick.outputs.do_pack == 'true' || steps.pick.outputs.do_shorts == 'true'
        run: |
          set -e
          DIR=work/${{ steps.pick.outputs.id }}/out
          test -f "$DIR/final.mp4" || { echo "final.mp4 не найден"; find work -type f | head -40; exit 1; }
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "shorts=$(ls "$DIR"/short_*.mp4 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
          echo "covers=$(ls "$DIR"/cover_*.jpg 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
          ls -la "$DIR"

      # Всё, что нужно человеку, одной ссылкой: длинный ролик, два шортса,
      # две обложки и субтитры. Шортсы помечены звёздочкой — на коротком
      # ролике второго шортса может не быть, и это не ошибка.
      - name: Выдаём ролик, шортсы и обложки
        if: steps.pick.outputs.do_pack == 'true' || steps.pick.outputs.do_shorts == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: final-${{ steps.pick.outputs.job }}
          name: Готово — ${{ steps.pick.outputs.job }}
          body: |
            Длинный ролик, шортсов ${{ steps.out.outputs.shorts }}, обложек ${{ steps.out.outputs.covers }}.

            `subs.srt` — субтитры для ручной заливки на YouTube после выкладки ролика.
            `cover_1.jpg` продублирован в `thumbnail.jpg`; `cover_2.jpg` — запасной вариант.
          files: |
            ${{ steps.out.outputs.dir }}/final.mp4
            ${{ steps.out.outputs.dir }}/subs.srt
            ${{ steps.out.outputs.dir }}/marks_final.json
            ${{ steps.out.outputs.dir }}/short_*.mp4
            ${{ steps.out.outputs.dir }}/cover_*.jpg
          fail_on_unmatched_files: false

      - name: Комплект для выкладки отдельно
        if: steps.pick.outputs.do_pack == 'true' || steps.pick.outputs.do_shorts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-${{ steps.pick.outputs.job }}
          path: |
            ${{ steps.out.outputs.dir }}/youtube.txt
            ${{ steps.out.outputs.dir }}/thumbnail.jpg
            ${{ steps.out.outputs.dir }}/cover_*.jpg
            ${{ steps.out.outputs.dir }}/subs.srt
            ${{ steps.out.outputs.dir }}/short_*.mp4
            ${{ steps.out.outputs.dir }}/shorts.json
          retention-days: 30

      - name: Диагностика при падении
        if: failure()
        run: |
          echo "=== папки ==="; find work -maxdepth 4 -type d 2>/dev/null || echo "нет"
          echo "=== файлы ==="; find work -maxdepth 4 -type f 2>/dev/null | head -40 || true
